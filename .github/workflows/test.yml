name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test functions/cart-checkout-validation/src/run.test.js functions/cart-transform/src/run.test.js functions/product-discount/src/run.test.js

  webhooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r webhook-service/requirements.txt
      - run: cd webhook-service && python -m pytest -q
