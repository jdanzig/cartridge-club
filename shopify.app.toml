# Shopify app configuration for the embedded "Compatibility Manager" Remix app.
# This file is committed; per-environment overrides live in shopify.app.<env>.toml
# (gitignored). Generated by `shopify app config link` and edited by hand.

client_id = "REPLACE_WITH_PARTNER_APP_CLIENT_ID"
name = "Cartridge Club Compatibility Manager"
handle = "cartridge-club-compat-manager"
application_url = "https://REPLACE_WITH_TUNNEL.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "your-store.myshopify.com"
include_config_on_deploy = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/paid" ]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory_levels/update"

  # GDPR / compliance topics — required for App Store eligibility.
  [[webhooks.subscriptions]]
  topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
scopes = "read_products,write_products,read_orders,read_inventory,write_metaobjects,read_metaobjects,read_files,write_files"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_TUNNEL.trycloudflare.com/auth/callback",
  "https://REPLACE_WITH_TUNNEL.trycloudflare.com/auth/shopify/callback",
  "https://REPLACE_WITH_TUNNEL.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
